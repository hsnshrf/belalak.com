name: voicevault
description: "VoiceVault — record, transcribe and search every conversation."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Audio capture / playback (per tech-stack decision)
  record: ^5.1.2
  just_audio: ^0.9.39
  audio_session: ^0.1.21

  # Offline-first storage: Drift over SQLite, FTS5 for offline search
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Networking / misc
  http: ^1.2.1
  crypto: ^3.0.3
  uuid: ^4.4.0
  path_provider: ^2.1.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
